    <!-- Self-Contained Fallback & Tile Layout CSS -->
    <style>
        :root {
            --maroon-main: #800000;
            --maroon-dark: #600000;
            --maroon-light: #fff5f5;
            --bg-gray: #f8fafc;
        }

        body {
            background-color: var(--bg-gray);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }

        /* 2-Column Responsive Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.85rem;
            padding: 0.25rem;
        }

        @media (min-width: 640px) {
            .dashboard-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
            }
        }

        /* Graphic Card Tile Styling */
        .bucket-tile {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.85rem;
            padding: 0.85rem 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            text-align: left;
            position: relative;
            overflow: hidden;
            border-top: 4px solid var(--maroon-main);
            width: 100%;
            min-height: 95px;
            box-sizing: border-box;
            outline: none;
        }

        .bucket-tile:active {
            transform: scale(0.97);
        }

        .bucket-tile:hover {
            box-shadow: 0 6px 16px rgba(128, 0, 0, 0.12);
            border-color: #cbd5e1;
            border-top-color: var(--maroon-main);
        }

        /* Icon Container */
        .tile-icon-bg {
            width: 36px;
            height: 36px;
            border-radius: 0.6rem;
            background-color: var(--maroon-light);
            color: var(--maroon-main);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.6rem;
        }

        /* Number Badge */
        .tile-badge {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            font-size: 0.65rem;
            font-weight: 800;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 0.15rem 0.4rem;
            border-radius: 0.35rem;
        }

        .bucket-tile:hover .tile-badge {
            background-color: var(--maroon-main);
            color: #ffffff;
        }

        /* Table & Content Typography Styles */
        .protocol-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .protocol-table th, .protocol-table td {
            border: 1px solid #e2e8f0;
            padding: 0.5rem 0.75rem;
        }
        .protocol-table th {
            background-color: #f8fafc;
            color: #1e293b;
            font-weight: 600;
        }

        .protocol-content h3 {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--maroon-main);
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.25rem;
        }
        .protocol-content h4 {
            font-weight: 600;
            font-size: 1rem;
            color: #334155;
            margin-top: 1rem;
            margin-bottom: 0.25rem;
        }
        .protocol-content ul {
            list-style-type: disc;
            padding-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .protocol-content ul ul {
            list-style-type: circle;
            padding-left: 1.25rem;
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
        }
        .protocol-content li {
            margin-bottom: 0.35rem;
        }
    </style>

    <!-- Application UI Controller Logic -->
    <script>
        const bucketNames = {
            1: "1. ASSESSMENT",
            2: "2. AIRWAY",
            3: "3. BUCKET 3",
            4: "4. BUCKET 4",
            5: "5. BUCKET 5",
            6: "6. BUCKET 6",
            7: "7. BUCKET 7",
            8: "8. BUCKET 8",
            9: "9. BUCKET 9",
            10: "10. BUCKET 10",
            11: "11. BUCKET 11",
            12: "12. BUCKET 12",
            13: "13. BUCKET 13",
            14: "14. BUCKET 14",
            15: "15. BUCKET 15",
            16: "16. BUCKET 16",
            17: "17. BUCKET 17",
            18: "18. BUCKET 18"
        };

        let currentScreen = 'home';

        function showScreen(screen) {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-list').classList.add('hidden');
            document.getElementById('screen-detail').classList.add('hidden');

            document.getElementById(`screen-${screen}`).classList.remove('hidden');
            currentScreen = screen;

            const backBtn = document.getElementById('back-btn');
            const appTitle = document.getElementById('app-header-title');

            if (screen === 'home') {
                backBtn.classList.add('hidden');
                appTitle.innerText = "EMS PROTOCOLS";
            } else {
                backBtn.classList.remove('hidden');
            }

            window.scrollTo(0, 0);
        }

        function openBucket(bucketId) {
            const protocols = protocolsDatabase[bucketId] || [];
            const listContainer = document.getElementById('protocol-list');
            const bucketTitleEl = document.getElementById('bucket-title');

            bucketTitleEl.innerText = bucketNames[bucketId] || `Bucket ${bucketId}`;
            listContainer.innerHTML = '';

            if (protocols.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-6 text-center text-gray-500 bg-white rounded-xl border border-gray-200">
                        No protocols loaded in this bucket yet.
                    </div>
                `;
            } else {
                protocols.forEach(p => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-4 bg-white rounded-xl border border-gray-200 shadow-sm hover:border-[#800000] transition flex justify-between items-center group";
                    btn.onclick = () => openProtocol(p);
                    
                    const cleanTitle = p.title.includes(': ') ? p.title.split(': ').slice(1).join(': ') : p.title;

                    btn.innerHTML = `
                        <div>
                            <span class="font-bold text-[#800000] block text-base">${p.id}</span>
                            <span class="text-sm text-gray-700">${cleanTitle}</span>
                        </div>
                        <span class="text-gray-400 group-hover:text-[#800000] font-bold">&rarr;</span>
                    `;
                    listContainer.appendChild(btn);
                });
            }

            showScreen('list');
        }

        function openProtocol(protocol) {
            const container = document.getElementById('protocol-detail-container');
            
            // Clean citations as a failsafe
            const keyword = "ci" + "te:";
            const regex = new RegExp("\\[" + keyword + " [0-9, ]+\\]", "g");
            const cleanContent = protocol.content.replace(regex, "");

            container.innerHTML = `
                <h2 class="text-xl font-bold text-[#800000] mb-3 pb-2 border-b-2 border-gray-100">${protocol.title}</h2>
                <div class="text-gray-800 leading-relaxed">
                    ${cleanContent}
                </div>
            `;
            
            showScreen('detail');
        }

        function goBack() {
            if (currentScreen === 'detail') {
                showScreen('list');
            } else if (currentScreen === 'list') {
                showScreen('home');
            }
        }
