<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS Protocol App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --maroon-main: #800000;
            --maroon-dark: #600000;
        }

        .bg-maroon { background-color: var(--maroon-main); }
        .text-maroon { color: var(--maroon-main); }
        .border-maroon { border-color: var(--maroon-main); }

        /* Custom styling for embedded protocol tables */
        .protocol-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .protocol-table th, .protocol-table td {
            border: 1px solid #e2e8f0;
            padding: 0.5rem 0.75rem;
        }
        .protocol-table th {
            background-color: #f8fafc;
            color: #1e293b;
            font-weight: 600;
        }

        /* Standardized content typography */
        .protocol-content h3 {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--maroon-main);
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.25rem;
        }
        .protocol-content h4 {
            font-weight: 600;
            font-size: 1rem;
            color: #334155;
            margin-top: 1rem;
            margin-bottom: 0.25rem;
        }
        .protocol-content ul {
            list-style-type: disc;
            padding-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .protocol-content ul ul {
            list-style-type: circle;
            padding-left: 1.25rem;
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
        }
        .protocol-content li {
            margin-bottom: 0.35rem;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-maroon text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button id="back-btn" onclick="goBack()" class="hidden bg-white/10 hover:bg-white/20 text-white px-3 py-1 rounded text-sm font-semibold transition">
                    &larr; Back

                <h1 id="app-header-title" class="text-lg font-bold tracking-wide">EMS PROTOCOLS</h1>
            </div>
            <button onclick="showScreen('home')" class="text-xs bg-white/10 hover:bg-white/20 px-2.5 py-1 rounded transition">
                Home

        </div>
    </header>

                    </button>
                    
                    <button onclick="openBucket(2)" class="p-4 bg-white border-2 border-gray-200 rounded-xl hover:border-maroon hover:shadow-md transition text-left flex items-center justify-between group">

                        <span class="text-gray-400 group-hover:text-maroon">&rarr;</span>
                    </button>

                    <button onclick="openBucket(3)" class="p-4 bg-white border-2 border-gray-200 rounded-xl hover:border-maroon hover:shadow-md transition text-left flex items-center justify-between group">

                    </button>

                    </button>

                    <button onclick="openBucket(6)" class="p-4 bg-white border-2 border-gray-200 rounded-xl hover:border-maroon hover:shadow-md transition text-left flex items-center justify-between group">

                    </button>

                    <button onclick="openBucket(7)" class="p-4 bg-white border-2 border-gray-200 rounded-xl hover:border-maroon hover:shadow-md transition text-left flex items-center justify-between group">
                        <span class="font-bold text-gray-800 group-hover:text-maroon">7. BUCKET 7</span>

                    </button>

                    <button onclick="openBucket(8)" class="p-4 bg-white border-2 border-gray-200 rounded-xl hover:border-maroon hover:shadow-md transition text-left flex items-center justify-between group">

    <!-- Bucket Scripts (1 - 18) -->

    <script src="bucket5.js"></script>

    <script src="bucket7.js"></script>
    <script src="bucket8.js"></script>
    <script src="bucket9.js"></script>

    <script src="bucket11.js"></script>
    <script src="bucket12.js"></script>

    <script src="bucket14.js"></script>
    <script src="bucket15.js"></script>
    <script src="bucket16.js"></script>
    <script src="bucket17.js"></script>
    <script src="bucket18.js"></script>

    <!-- Application UI Controller Logic -->
    <script>
        const bucketNames = {
            1: "1. ASSESSMENT",
            2: "2. AIRWAY",
            3: "3. BUCKET 3",
            4: "4. BUCKET 4",
            5: "5. BUCKET 5",
            6: "6. BUCKET 6",
            7: "7. BUCKET 7",
            8: "8. BUCKET 8",
            9: "9. BUCKET 9",
            10: "10. BUCKET 10",
            11: "11. BUCKET 11",
            12: "12. BUCKET 12",
            13: "13. BUCKET 13",
            14: "14. BUCKET 14",
            15: "15. BUCKET 15",
            16: "16. BUCKET 16",
            17: "17. BUCKET 17",
            18: "18. BUCKET 18"
        };

        let currentScreen = 'home';

        function showScreen(screen) {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-list').classList.add('hidden');
            document.getElementById('screen-detail').classList.add('hidden');

            document.getElementById(`screen-${screen}`).classList.remove('hidden');
            currentScreen = screen;

            const backBtn = document.getElementById('back-btn');
            const appTitle = document.getElementById('app-header-title');

            if (screen === 'home') {
                backBtn.classList.add('hidden');
                appTitle.innerText = "EMS PROTOCOLS";
            } else {
                backBtn.classList.remove('hidden');
            }

            window.scrollTo(0, 0);
        }

        function openBucket(bucketId) {
            const protocols = protocolsDatabase[bucketId] || [];
            const listContainer = document.getElementById('protocol-list');
            const bucketTitleEl = document.getElementById('bucket-title');

            bucketTitleEl.innerText = bucketNames[bucketId] || `Bucket ${bucketId}`;
            listContainer.innerHTML = '';

            if (protocols.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-6 text-center text-gray-500 bg-white rounded-xl border border-gray-200">
                        No protocols loaded in this bucket yet.
                    </div>
                `;
            } else {
                protocols.forEach(p => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-4 bg-white rounded-xl border border-gray-200 shadow-sm hover:border-maroon transition flex justify-between items-center group";
                    btn.onclick = () => openProtocol(p);
                    
                    const cleanTitle = p.title.includes(': ') ? p.title.split(': ').slice(1).join(': ') : p.title;

                    btn.innerHTML = `
                        <div>
                            <span class="font-bold text-maroon block text-base">${p.id}</span>
                            <span class="text-sm text-gray-700">${cleanTitle}</span>
                        </div>
                        <span class="text-gray-400 group-hover:text-maroon font-bold">&rarr;</span>
                    `;
                    listContainer.appendChild(btn);
                });
            }

            showScreen('list');
        }

        function openProtocol(protocol) {
            const container = document.getElementById('protocol-detail-container');
            
            // Clean citations as a failsafe
            const keyword = "ci" + "te:";
            const regex = new RegExp("\\[" + keyword + " [0-9, ]+\\]", "g");
            const cleanContent = protocol.content.replace(regex, "");

            container.innerHTML = `
                <h2 class="text-xl font-bold text-maroon mb-3 pb-2 border-b-2 border-gray-100">${protocol.title}</h2>
                <div class="text-gray-800 leading-relaxed">
                    ${cleanContent}
                </div>
            `;
            
            showScreen('detail');
        }

        function goBack() {
            if (currentScreen === 'detail') {
                showScreen('list');
            } else if (currentScreen === 'list') {
                showScreen('home');
            }
        }
    </script>
</body>
</html>
