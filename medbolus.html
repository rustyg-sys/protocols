<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Bolus Calculator</title>
    
    <!-- Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --maroon-main: #800020;
            --grey-light: #f3f4f6;
        }
        body {
            background-color: var(--grey-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
        }
        .header-bar {
            background-color: var(--maroon-main);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header with Back Button -->
    <header class="header-bar p-3 sticky top-0 z-50 flex items-center justify-between">
        <!-- Make sure href points back to your main app file -->
        <a href="index.html" class="text-white w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/20 transition">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-lg font-bold flex-1 text-center truncate pr-10">Medication Bolus</h1>
    </header>

    <!-- Calculator Main Container -->
    <main class="flex-1 max-w-lg w-full mx-auto p-4">
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 space-y-5">
            <p class="text-sm text-gray-600 text-center mb-2">Enter parameters to calculate total dose and volume.</p>
            
            <!-- Patient Weight -->
            <div class="flex gap-3">
                <div class="w-1/2">
                    <label class="block text-xs font-bold text-[#800020] uppercase mb-1">Patient Weight</label>
                    <input type="number" id="bolus-weight" oninput="calculateBolus()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-[#800020] focus:border-[#800020] block p-3" placeholder="Weight" min="0">
                </div>
                <div class="w-1/2">
                    <label class="block text-xs font-bold text-[#800020] uppercase mb-1">Unit</label>
                    <select id="bolus-unit" onchange="calculateBolus()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-[#800020] focus:border-[#800020] block p-3">
                        <option value="kg">Kilograms (kg)</option>
                        <option value="lbs">Pounds (lbs)</option>
                    </select>
                </div>
            </div>

            <!-- Desired Dose -->
            <div>
                <label class="block text-xs font-bold text-[#800020] uppercase mb-1">Desired Dose (per kg)</label>
                <div class="relative">
                    <input type="number" id="bolus-dose" oninput="calculateBolus()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-[#800020] focus:border-[#800020] block p-3 pr-20" placeholder="e.g., 5" min="0">
                    <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-500 font-bold">
                        units/kg
                    </div>
                </div>
            </div>

            <hr class="border-gray-200 my-2">

            <!-- Medication Concentration -->
            <div>
                <label class="block text-xs font-bold text-[#800020] uppercase mb-1">Concentration On Hand</label>
                <div class="flex items-center gap-3">
                    <div class="w-1/2 relative">
                        <input type="number" id="bolus-amount" oninput="calculateBolus()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-[#800020] focus:border-[#800020] block p-3 pr-10" placeholder="Amount" min="0">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-500 text-xs font-bold">
                            mg/mcg
                        </div>
                    </div>
                    <span class="text-gray-400 font-bold text-xl">/</span>
                    <div class="w-1/2 relative">
                        <input type="number" id="bolus-volume" oninput="calculateBolus()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-[#800020] focus:border-[#800020] block p-3 pr-10" placeholder="Volume" min="0">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-500 text-xs font-bold">
                            mL
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Output Box -->
        <div class="mt-5 bg-emerald-50 border-l-4 border-emerald-500 p-5 rounded-r-xl shadow-sm">
            <h3 class="text-emerald-800 font-bold text-sm uppercase tracking-wider mb-3">Administration Guide</h3>
            
            <div class="flex justify-between items-end mb-3 pb-3 border-b border-emerald-200">
                <span class="text-emerald-900 font-semibold">Total Dose:</span>
                <span class="text-2xl font-black text-emerald-700"><span id="bolus-total-dose">0.00</span> <span class="text-base font-normal">units</span></span>
            </div>
            
            <div class="flex justify-between items-end">
                <span class="text-emerald-900 font-semibold">Volume to Administer:</span>
                <span class="text-3xl font-black text-[#800020]"><span id="bolus-total-volume">0.00</span> <span class="text-lg font-normal text-emerald-700">mL</span></span>
            </div>
        </div>
    </main>

    <!-- Calculator Logic Script -->
    <script>
        function calculateBolus() {
            // Grab values from inputs
            const weight = parseFloat(document.getElementById('bolus-weight').value) || 0;
            const isLbs = document.getElementById('bolus-unit').value === 'lbs';
            const dosePerKg = parseFloat(document.getElementById('bolus-dose').value) || 0;
            const amountOnHand = parseFloat(document.getElementById('bolus-amount').value) || 0;
            const volumeOnHand = parseFloat(document.getElementById('bolus-volume').value) || 0;

            // Convert pounds to kg if necessary
            const weightKg = isLbs ? (weight / 2.20462) : weight;

            // Calculate Total Dose
            const totalDose = weightKg * dosePerKg;

            // Calculate Total Volume
            let totalVolume = 0;
            if (amountOnHand > 0 && volumeOnHand > 0) {
                const concentration = amountOnHand / volumeOnHand;
                totalVolume = totalDose / concentration;
            }

            // Update UI with 2 decimal places
            document.getElementById('bolus-total-dose').innerText = totalDose > 0 ? totalDose.toFixed(2) : "0.00";
            document.getElementById('bolus-total-volume').innerText = totalVolume > 0 ? totalVolume.toFixed(2) : "0.00";
        }
    </script>
</body>
</html>
